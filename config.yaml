project:
  name: "Spotify Track Popularity Analytics"
  version: "1.0"
  author: "Jan Noel Vero"
  year: 2026

paths:
  raw_data: "data/raw"
  clean_data: "data/clean"
  tableau_data: "data/tableau"
  notebooks: "notebooks"
  sql: "sql_scripts"
  tableau: "tableau"
  figures: "figures"
  source: "src"

data:
  cleaned_file: "spotify_final.csv"
  feature_file: "spotify_features.csv"
  mysql_file: "spotify_mysql.csv"
  tableau_file: "spotify_tableau_final.csv"
  total_tracks: 8775

database:
  dialect: "mysql"
  driver: "pymysql"
  host: "127.0.0.1"
  port: 3306
  database: "spotify_db"

tables:
  staging: "spotify_tracks"
  artists: "artists"
  albums: "albums"
  tracks: "tracks"
  genres: "genres"
  track_genres: "track_genres"

analysis:
  minimum_artist_tracks: 10
  minimum_genre_tracks: 30
  minimum_decade_tracks: 30
  high_popularity_threshold: 90

tableau:
  workbook: "tableau/spotify_analysis.twbx"
  primary_source: "data/tableau/spotify_tableau_final.csv"
  model_performance_source: "data/tableau/spotify_model_performance.csv"
  feature_importance_source: "data/tableau/spotify_feature_importance.csv"
